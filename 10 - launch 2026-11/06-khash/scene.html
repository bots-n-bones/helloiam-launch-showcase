<!doctype html>
<html lang="en" data-genre="horror">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KHASH · Trailer composition</title>
  <link rel="stylesheet" href="scene.css">
  <script src="scene.js" defer></script>
</head>
<body>
  <main class="film" aria-label="Khash trailer">
    <section class="shot calendar" data-start="0">
      <p class="mark">helloiam.am</p>
      <div class="calendar-copy">
        <p class="calendar-heading">ONLY IN MONTHS WITH AN <em>R.</em></p>
        <div class="letter" aria-hidden="true">R</div>
        <p class="months">SEPTEMBER — APRIL</p>
      </div>
      <p class="category">AM FOOD</p>
    </section>
    <section class="shot fog" data-start="4">
      <video class="media" muted playsinline preload="auto" aria-label="Fog over the hills"
        src="../01-objects/02-media-unsorted/hf_20260428_184651_e860c56e-48b3-479a-b8a6-cb621c347f9a.mp4"></video>
      <div class="caption">
        <p data-tone="horror">SOMETHING<br>SIMMERED ALL NIGHT.</p>
        <p data-tone="comedy">THE PLAN:<br>SLEEP IN.</p>
      </div>
    </section>
    <section class="shot laughter" data-start="7">
      <p class="word syllable-one">HA</p>
      <p class="word syllable-two">HAHAHA</p>
      <p class="word syllable-three">HA<em>SHHHH</em></p>
    </section>
    <section class="shot lavash" data-start="11">
      <img class="media" src="../01-objects/02-media-unsorted/helloiam_image_53.png" alt="Folded lavash">
    </section>
    <section class="shot toast" data-start="15">
      <img class="media" src="../01-objects/02-media-unsorted/helloiam_image_12.png" alt="People raising glasses around a table">
      <div class="caption">
        <p><strong>8 AM.</strong><span data-tone="horror">THEY’RE ALREADY HERE.</span><span data-tone="comedy">FULL HOUSE.</span></p>
      </div>
    </section>
    <section class="shot ending" data-start="19">
      <p class="mark">helloiam.am</p>
      <p class="word closing-hush" aria-hidden="true">HA<span>SH</span><span class="scatter">H</span><span class="scatter">H</span><span class="scatter">H</span></p>
      <div class="end-copy">
        <h1><span>K</span>HASH</h1>
        <p class="tagline" data-tone="horror">IT’S BACK FOR THE WINTER.</p>
        <p class="tagline" data-tone="comedy">BREAKFAST GOT<br>OUT OF HAND.</p>
      </div>
      <p class="category">AM FOOD</p>
    </section>
  </main>
</body>
</html>
