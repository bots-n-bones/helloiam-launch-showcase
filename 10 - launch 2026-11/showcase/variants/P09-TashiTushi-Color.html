<html lang="ru">
<head><link rel="stylesheet" href="../access.css"><script src="../access.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Игры, промо-посты и дизайн-система helloiam.am">
<title>Tashi Tushi · helloiam.am</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0}
@property --ac{syntax:'<color>';inherits:true;initial-value:#ea5028}
@keyframes cyc{0%{background-color:#f6c757;color:#0f0f10;--ac:#ea5028}20%{background-color:#c5342e;color:#ffffff;--ac:#f6c757}40%{background-color:#0f0f10;color:#ffffff;--ac:#ea5028}60%{background-color:#557af7;color:#ffffff;--ac:#0f0f10}80%{background-color:#ffffff;color:#0f0f10;--ac:#c5342e}}
.cyc{animation:cyc 3s steps(1) infinite;animation-delay:-2.4s}
@media (prefers-reduced-motion:reduce){.cyc{animation:none}}
@keyframes dance{0%{transform:scaleX(1) translateY(0) rotate(-4deg)}25%{transform:scaleX(1) translateY(-26px) rotate(3deg)}50%{transform:scaleX(-1) translateY(0) rotate(-4deg)}75%{transform:scaleX(-1) translateY(-26px) rotate(3deg)}}
@keyframes drum{0%{transform:scale(1) rotate(-8deg)}50%{transform:scale(1.08) rotate(-4deg)}}
@keyframes beatA{0%{color:#c5342e}50%{color:#0f0f10}}
@keyframes beatB{0%{color:#0f0f10}50%{color:#c5342e}}
.dance{animation:dance 1.2s steps(1) infinite}
.drum{animation:drum .6s steps(1) infinite}
.beatA{animation:beatA 1.2s steps(1) infinite}
.beatB{animation:beatB 1.2s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.dance,.drum,.beatA,.beatB{animation:none}}

:root:not([data-motion="playing"]) .canvas *{animation-play-state:paused!important}
.preview-title{margin:22px 0 10px;font:700 clamp(30px,5vw,64px)/1 var(--sans)}
.motion-toggle{margin-bottom:12px;padding:8px;background:transparent;border:1px solid;cursor:pointer}
.art-frame{width:min(100%,540px);aspect-ratio:4/5;position:relative;overflow:hidden}
.canvas{position:absolute;inset:0 auto auto 0;width:1080px;height:1350px;transform-origin:top left}
</style><script defer src="preview.js"></script>
</head>
<body><div class="shell"><header class="mast"><a href="../">← Витрина</a></header><h1 class="preview-title">Tashi Tushi</h1><button class="motion-toggle" type="button" aria-pressed="false">▶ Воспроизвести</button>
<div class="art-frame"><div class="canvas"><div class="cyc" style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #ffffff; color: #0f0f10; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<p style="position: absolute; left: 40px; top: 36px; margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 96px; line-height: 96px; letter-spacing: -0.01em">Hello, I am</p>
<p style="position: absolute; left: 24px; top: 130px; margin: 0; font-size: 330px; line-height: 290px; font-weight: 700; letter-spacing: -0.05em; color: var(--ac, #c5342e)">TASHI</p>
<p style="position: absolute; left: 24px; top: 950px; margin: 0; font-size: 330px; line-height: 290px; font-weight: 700; letter-spacing: -0.05em">TUSHI</p>

</div>
</div></div></div></div></body>
