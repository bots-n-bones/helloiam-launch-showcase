<style>
body{margin:0}
@property --ac{syntax:'<color>';inherits:true;initial-value:#ea5028}
@keyframes cyc{0%{background-color:#f6c757;color:#0f0f10;--ac:#ea5028}20%{background-color:#c5342e;color:#ffffff;--ac:#f6c757}40%{background-color:#0f0f10;color:#ffffff;--ac:#ea5028}60%{background-color:#557af7;color:#ffffff;--ac:#0f0f10}80%{background-color:#ffffff;color:#0f0f10;--ac:#c5342e}}
.cyc{animation:cyc 3s steps(1) infinite;animation-delay:-0s}
@media (prefers-reduced-motion:reduce){.cyc{animation:none}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes bump{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.spin{animation:spin 2.4s steps(8) infinite}
.bump{animation:bump .6s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.spin,.bump{animation:none}}

:root:not([data-motion="playing"]) .canvas *{animation-play-state:paused!important}
.preview-title{margin:22px 0 10px;font:700 clamp(30px,5vw,64px)/1 var(--sans)}
.motion-toggle{margin-bottom:12px;padding:8px;background:transparent;border:1px solid;cursor:pointer}
.art-frame{width:min(100%,540px);aspect-ratio:4/5;position:relative;overflow:hidden}
.canvas{position:absolute;inset:0 auto auto 0;width:1080px;height:1350px;transform-origin:top left}
</style><script defer src="preview.js"></script>
</head>
