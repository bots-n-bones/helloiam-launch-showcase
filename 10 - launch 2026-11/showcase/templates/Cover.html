<style>
body{margin:0;background:var(--yellow)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--yellow);font-family:var(--font-sans)}
.cv svg{position:absolute;inset:0}

<!-- blocks: red 160×288, black 80×200, red 80×120, black 80×288 — widths are 2× and 4× post-pad (40px), square corners (radius-none); ground is yellow
     arrangement: a strip of unequal bands hung from the top edge, like a carousel mid-swipe; no blue and no white, so no forbidden flag pairing appears
     pattern: discs — the dot of helloiam.am that every object replaces; each disc takes its ground's accent token (yellow on red, orange on black, black on yellow)
     steps and radii: band width 80px (2 × post-pad), disc r 20px (post-pad / 2), disc pitch 40px, radius-none on blocks -->

<rect class="b-black" x="680" y="0" width="80" height="200"/>

<circle class="d-orange" cx="920" cy="248" r="20"/>
