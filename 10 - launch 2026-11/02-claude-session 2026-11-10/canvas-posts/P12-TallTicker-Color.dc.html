<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tall object — duduks running top to bottom over the text — colour cycle</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
body{margin:0}
@property --ac{syntax:'<color>';inherits:true;initial-value:#ea5028}
@keyframes cyc{0%{background-color:#f6c757;color:#0f0f10;--ac:#ea5028}20%{background-color:#c5342e;color:#ffffff;--ac:#f6c757}40%{background-color:#0f0f10;color:#ffffff;--ac:#ea5028}60%{background-color:#557af7;color:#ffffff;--ac:#0f0f10}80%{background-color:#ffffff;color:#0f0f10;--ac:#c5342e}}
.cyc{animation:cyc 3s steps(1) infinite;animation-delay:-0s}
@media (prefers-reduced-motion:reduce){.cyc{animation:none}}
@keyframes fall{from{transform:translateY(-2000px)}to{transform:translateY(0)}}
.fall{animation:fall 3s linear infinite}
@media (prefers-reduced-motion:reduce){.fall{animation:none}}
</style>
</helmet>
<div class="cyc" style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #f6c757; color: #0f0f10; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<p style="position: absolute; left: 40px; top: 36px; margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 128px; line-height: 128px; letter-spacing: -0.01em">Hello, I am</p>
<p style="position: absolute; left: 14px; top: 190px; margin: 0; font-size: 560px; line-height: 470px; font-weight: 700; letter-spacing: -0.055em; color: var(--ac, #ea5028)">DU<br>DUK</p>
<div class="fall" style="position: absolute; left: 250px; top: 0; width: 1000px; transform: translateY(-2000px)">
<img src="/_blob/bd4f647a25859d3ab6cb2b5e0cf6d1f5" alt="Duduk" style="display: block; width: 1000px; height: 1000px; object-fit: contain">
<img src="/_blob/bd4f647a25859d3ab6cb2b5e0cf6d1f5" alt="" style="display: block; width: 1000px; height: 1000px; object-fit: contain">
<img src="/_blob/bd4f647a25859d3ab6cb2b5e0cf6d1f5" alt="" style="display: block; width: 1000px; height: 1000px; object-fit: contain">
<img src="/_blob/bd4f647a25859d3ab6cb2b5e0cf6d1f5" alt="" style="display: block; width: 1000px; height: 1000px; object-fit: contain">
</div>
<p style="position: absolute; left: 40px; bottom: 40px; margin: 0; font-size: 24px; line-height: 24px; font-weight: 700">AM SOUND</p>
</div>
</x-dc>
