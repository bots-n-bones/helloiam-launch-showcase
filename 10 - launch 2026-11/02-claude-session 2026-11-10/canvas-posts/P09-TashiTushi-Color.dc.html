<style>
body{margin:0}
@property --ac{syntax:'<color>';inherits:true;initial-value:#ea5028}
@keyframes cyc{0%{background-color:#f6c757;color:#0f0f10;--ac:#ea5028}20%{background-color:#c5342e;color:#ffffff;--ac:#f6c757}40%{background-color:#0f0f10;color:#ffffff;--ac:#ea5028}60%{background-color:#557af7;color:#ffffff;--ac:#0f0f10}80%{background-color:#ffffff;color:#0f0f10;--ac:#c5342e}}
.cyc{animation:cyc 3s steps(1) infinite;animation-delay:-2.4s}

@keyframes dance{0%,100%{transform:scaleX(1) translateY(0)}25%{transform:scaleX(1) translateY(-30px)}50%{transform:scaleX(-1) translateY(0)}75%{transform:scaleX(-1) translateY(-30px)}}
@keyframes drum{0%,100%{transform:scale(1) rotate(-8deg)}50%{transform:scale(1.06) rotate(-6deg)}}
@keyframes beatA{0%{color:#c5342e}50%{color:#0f0f10}}
@keyframes beatB{0%{color:#0f0f10}50%{color:#c5342e}}
.dance{animation:dance 2.4s ease-in-out infinite}
.drum{animation:drum 1.2s ease-in-out infinite}
.beatA{animation:beatA 1.2s steps(1) infinite}
.beatB{animation:beatB 1.2s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.dance,.drum,.beatA,.beatB{animation:none}}
</style>
</helmet>
